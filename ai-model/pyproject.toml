[project]
name = "ngonsacviet-ml"
version = "0.1.0"
description = "Translation, OCR and speech interface for Ngon Sac Viet"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
train = [
  "transformers>=4.46",
  "sentencepiece>=0.2",
  "torch>=2.4",
  "sacrebleu>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
